<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0ea5e9">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>客户管理工作台</title>
<link rel="stylesheet" href="https://unpkg.com/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://unpkg.com/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* 三路兜底加载 supabase：不用 document.write（它会清空页面），改用 DOM 插入 */
(function(){
  if(window.supabase) return;
  var urls=[
    'https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.0/supabase.min.js',
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  var i=0;
  function next(){
    if(window.supabase) return;
    if(i>=urls.length){ console.error('[supabase] 所有 CDN 均加载失败'); return; }
    var s=document.createElement('script');
    s.src=urls[i++];
    s.onload=function(){ if(!window.supabase) next(); };
    s.onerror=next;
    document.head.appendChild(s);
  }
  next();
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
:root{
  --sky:#0ea5e9;--sky-mid:#38bdf8;--sky-light:#e0f2fe;--sky-50:#f0f9ff;--sky-100:#e0f2fe;
  --white:#ffffff;--bg:#f0f6fb;--text:#0f172a;--text-2:#475569;--text-3:#94a3b8;
  --border:#dbe7f0;--border-l:#e8f0f5;--green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --r:14px;--r-sm:10px;
}
html,body{height:100%;overflow-x:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;min-height:100vh;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);
}

/* ===== 顶部 ===== */
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);padding:max(14px,env(safe-area-inset-top)) 16px 12px;}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.header-title{font-size:18px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
.header-title i{color:var(--sky);font-size:21px;}
.header-actions{display:flex;gap:8px;}
.h-btn{height:38px;min-width:38px;padding:0 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--text-2);font-size:16px;cursor:pointer;transition:all .15s;font-weight:500;}
.h-btn:active{background:var(--sky-50);border-color:var(--sky);color:var(--sky);}
.h-btn span{font-size:13px;}

/* 面包屑 */
.breadcrumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--text-3);margin-bottom:10px;}
.bc-item{color:var(--sky);cursor:pointer;font-weight:500;padding:3px 8px;border-radius:6px;transition:background .12s;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bc-item:active{background:var(--sky-50);}
.bc-sep{color:var(--text-3);font-size:11px;}
.bc-current{color:var(--text);font-weight:700;padding:3px 8px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 搜索 */
.search-box{position:relative;display:flex;align-items:center;background:var(--sky-50);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:0 12px;transition:all .2s;}
.search-box:focus-within{border-color:var(--sky);background:#fff;box-shadow:0 0 0 3px var(--sky-light);}
.search-box>i{color:var(--text-3);font-size:17px;}
.search-box input{flex:1;border:none;background:transparent;padding:11px 10px;font-size:15px;color:var(--text);outline:none;min-width:0;}
.search-box input::placeholder{color:var(--text-3);}
.search-box .clear{color:var(--text-3);font-size:18px;cursor:pointer;display:none;padding:6px;}
.search-box .clear.show{display:block;}
.search-panel{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 30px rgba(14,165,233,0.15);max-height:55vh;overflow-y:auto;z-index:60;display:none;}
.search-panel.show{display:block;}
.sr-item{padding:13px 15px;border-bottom:1px solid var(--border-l);cursor:pointer;}
.sr-item:active{background:var(--sky-50);}
.sr-item:last-child{border-bottom:none;}
.sr-path{font-size:12px;color:var(--text-3);margin-bottom:3px;}
.sr-title{font-weight:600;color:var(--text);font-size:15px;}
.sr-phone{font-size:13px;color:var(--sky);margin-top:3px;display:flex;align-items:center;gap:5px;}
.sr-empty{text-align:center;padding:28px;color:var(--text-3);font-size:14px;}
.sr-count{padding:10px 15px;font-size:12.5px;color:var(--text-2);background:var(--sky-50);border-bottom:1px solid var(--border-l);position:sticky;top:0;z-index:2;}
.sr-count b{color:var(--sky);font-size:14px;}
.sr-group{padding:8px 15px 6px;font-size:11.5px;font-weight:700;color:var(--text-3);background:#f8fafc;border-bottom:1px solid var(--border-l);display:flex;align-items:center;gap:6px;}
.sr-group i{color:var(--sky);font-size:13px;}
.sr-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.sr-tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--sky-50);color:var(--sky);font-weight:600;}
mark{background:#fef9c3;color:inherit;padding:0 2px;border-radius:3px;}
.sr-more{padding:12px 15px;font-size:12.5px;color:var(--text-3);text-align:center;background:#fafbfc;}

/* ===== 主体 ===== */
.main{padding:14px 14px 100px;max-width:680px;margin:0 auto;}
.stats{display:flex;gap:10px;margin-bottom:14px;}
.stat-card{flex:1;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(14,165,233,0.05);}
.stat-card .si{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.stat-card.c1 .si{background:var(--sky-50);color:var(--sky);}
.stat-card.c2 .si{background:#ecfdf5;color:var(--green);}
.stat-card .num{font-size:19px;font-weight:700;color:var(--text);line-height:1.2;}
.stat-card .lbl{font-size:12px;color:var(--text-3);}

.toolbar-row{display:flex;gap:8px;margin-bottom:12px;}
.tb-btn{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:#fff;font-size:13px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;}
.tb-btn:active{background:var(--sky-50);border-color:var(--sky);color:var(--sky);}
.tb-btn i{font-size:15px;}

.page-title{font-size:15px;font-weight:700;color:var(--text-2);margin-bottom:10px;padding-left:4px;display:flex;align-items:center;gap:6px;}
.page-title .pt-count{font-size:12px;color:var(--text-3);font-weight:500;}

/* ===== 列表 ===== */
.list{display:flex;flex-direction:column;gap:8px;}
.item-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 8px rgba(14,165,233,0.06);transition:box-shadow .15s;}
.item-card:active{box-shadow:0 4px 16px rgba(14,165,233,0.15);}

/* 卡片头部通用：标题可换行 */
.item-head{display:flex;align-items:center;gap:10px;padding:15px 14px;cursor:pointer;}
.i-title{flex:1;min-width:0;font-weight:700;font-size:16px;color:var(--text);word-break:break-all;line-height:1.4;}
.badge{font-size:11px;padding:3px 9px;border-radius:10px;flex-shrink:0;font-weight:600;}
.chev{color:var(--text-3);font-size:14px;flex-shrink:0;}
.act-row{display:flex;gap:4px;flex-shrink:0;}
.act-btn{width:32px;height:32px;border-radius:8px;border:none;background:rgba(14,165,233,0.1);color:var(--sky);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:all .12s;}
.act-btn:active{transform:scale(0.9);background:var(--sky);color:#fff;}
.act-btn.danger{color:var(--red);background:rgba(239,68,68,0.1);}
.act-btn.danger:active{background:var(--red);color:#fff;}
.drag{color:var(--text-3);font-size:20px;cursor:grab;padding:6px 2px;touch-action:none;}
.drag:active{cursor:grabbing;color:var(--sky);}

/* L1 区域 */
.card-l1 .item-head{background:linear-gradient(90deg,var(--sky-50) 0%,#fff 60%);border-left:5px solid var(--sky);}
.card-l1 .i-icon{color:var(--sky);font-size:19px;flex-shrink:0;}
.card-l1 .badge{background:var(--sky-light);color:var(--sky);}

/* L2 楼盘 */
.card-l2{border-radius:var(--r-sm);}
.card-l2 .item-head{padding:13px 12px;}
.card-l2 .i-icon{color:var(--sky);font-size:17px;flex-shrink:0;}
.card-l2 .i-title{font-weight:600;font-size:14.5px;}
.card-l2 .badge{color:var(--text-2);background:var(--sky-50);border:1px solid var(--border);}

/* L3 楼层（不可拖动） */
.card-l3{background:var(--sky-50);border-radius:var(--r-sm);}
.card-l3 .item-head{padding:12px 12px;}
.card-l3 .i-icon{color:var(--sky);font-size:15px;flex-shrink:0;}
.card-l3 .i-title{font-weight:600;font-size:14px;}
.card-l3 .badge.has{color:var(--green);background:#ecfdf5;border:1px solid #d1fae5;}
.card-l3 .badge.zero{color:var(--text-3);background:#fff;border:1px solid var(--border);}

/* ===== L4 室（展开式） ===== */
.room{background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;}
.room-head{
  display:flex;align-items:center;gap:9px;padding:12px 12px;cursor:pointer;
  background:linear-gradient(90deg,#f8fbff,#fff);
}
.room-head .drag{font-size:18px;padding:4px 2px;}
.room-head .r-toggle{
  width:22px;height:22px;border-radius:6px;background:var(--sky-50);color:var(--sky);
  display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;
  transition:transform .25s;border:1px solid var(--border);
}
.room-head .r-toggle.collapsed{transform:rotate(-90deg);}
.room-head .r-icon{color:var(--sky);font-size:15px;flex-shrink:0;}
.room-head .r-title{flex:1;font-weight:600;font-size:14px;color:var(--text);min-width:0;word-break:break-all;line-height:1.4;}
.room-head .badge{color:var(--green);background:#ecfdf5;border:1px solid #d1fae5;}
.room-head .badge.zero{color:var(--text-3);background:#fff;border:1px solid var(--border);}
.room-body{padding:6px 8px 10px 14px;display:none;flex-direction:column;gap:6px;background:rgba(240,249,255,0.4);}
.room-body.open{display:flex;}

/* L5 客户卡片 */
.client{background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 12px;display:flex;align-items:flex-start;gap:10px;}
.client .c-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--sky-mid),var(--sky));color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex-shrink:0;}
.client .c-body{flex:1;min-width:0;}
.client .c-name{font-weight:700;font-size:15px;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.client .c-phone{font-size:13px;color:var(--sky);margin-top:4px;display:flex;align-items:center;gap:5px;}
.client .c-phone a{color:var(--sky);text-decoration:none;font-weight:600;}
.client .c-note{font-size:13px;color:var(--text-2);margin-top:3px;}
.client .c-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.client .c-tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--sky-50);color:var(--sky);border:1px solid var(--border);font-weight:500;}
.client .c-tag.vip{background:#fef3c7;color:#b45309;border-color:#fde68a;}
.client .c-right{display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-items:center;}
.client .drag{font-size:18px;padding:4px 2px;line-height:1;}
.no-phone{font-size:12px;color:var(--amber);font-style:italic;display:flex;align-items:center;gap:5px;margin-top:4px;font-weight:500;}

/* 空提示 */
.empty-hint{font-size:13px;color:var(--text-3);text-align:center;padding:40px 20px;}
.empty-hint i{font-size:48px;color:var(--sky-light);display:block;margin-bottom:12px;}
.empty-hint h3{font-size:16px;color:var(--text);margin-bottom:6px;}
.empty-hint p{font-size:13px;}

/* FAB */
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:18px;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--sky-mid),var(--sky));color:#fff;font-size:28px;cursor:pointer;box-shadow:0 6px 20px rgba(14,165,233,0.45);z-index:40;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
.fab:active{transform:scale(0.88);}

/* 模态框 */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:#fff;width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .28s ease;}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-bar{width:40px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 16px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
.modal-title i{color:var(--sky);font-size:20px;}
.modal-x{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg);color:var(--text-3);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-x:active{background:var(--border);}

.fg{margin-bottom:14px;}
.fg label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:6px;}
.fg label .req{color:var(--red);}
.fg input,.fg textarea,.fg select{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;color:var(--text);background:#fff;outline:none;font-family:inherit;transition:all .2s;}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-light);}
.fg textarea{resize:vertical;min-height:65px;}

.level-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
.lp{padding:15px 8px;border:1.5px solid var(--border);border-radius:var(--r-sm);text-align:center;cursor:pointer;background:#fff;transition:all .12s;}
.lp:active{transform:scale(0.97);}
.lp.on{border-color:var(--sky);background:var(--sky-50);box-shadow:0 0 0 3px var(--sky-light);}
.lp i{font-size:24px;display:block;margin-bottom:5px;}
.lp .t{font-size:13px;font-weight:600;}
.lp .d{font-size:11px;color:var(--text-3);margin-top:2px;}

.modal-btns{display:flex;gap:10px;margin-top:18px;}
.btn{flex:1;padding:14px;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s;}
.btn:active{transform:scale(0.97);}
.btn-ok{background:var(--sky);color:#fff;box-shadow:0 4px 12px rgba(14,165,233,0.35);}
.btn-cancel{background:var(--bg);color:var(--text-2);}
.btn-danger{background:#fee2e2;color:var(--red);}

.io-grid{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;}
.io-card{padding:18px;border:2px dashed var(--sky);border-radius:var(--r);background:var(--sky-50);cursor:pointer;text-align:center;transition:all .12s;display:flex;align-items:center;gap:14px;}
.io-card:active{background:var(--sky-light);}
.io-card .io-icon{width:48px;height:48px;border-radius:12px;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.io-card .io-text{text-align:left;}
.io-card .io-t{font-size:15px;font-weight:700;color:var(--text);}
.io-card .io-d{font-size:12px;color:var(--text-3);margin-top:2px;}

.warn-box{background:#fffbeb;border:1px solid #fde68a;border-radius:var(--r-sm);padding:11px 13px;font-size:13px;color:#92400e;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;line-height:1.5;}
.warn-box i{color:var(--amber);font-size:16px;flex-shrink:0;margin-top:1px;}
.warn-box.info{background:var(--sky-50);border-color:var(--border);color:var(--text-2);}
.warn-box.info i{color:var(--sky);}

.toast{position:fixed;top:max(72px,calc(env(safe-area-inset-top)+72px));left:50%;transform:translateX(-50%) translateY(-120px);opacity:0;background:rgba(15,23,42,0.95);color:#fff;padding:11px 22px;border-radius:24px;font-size:14px;z-index:999;transition:transform .3s cubic-bezier(.4,1.4,.5,1),opacity .3s;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.25);white-space:nowrap;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}

.sortable-ghost{opacity:0.3;}
.sortable-chosen{box-shadow:0 8px 24px rgba(14,165,233,0.2)!important;}
.sortable-drag{opacity:0.95;transform:rotate(1deg);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<!-- 登录/注册覆盖层 -->
<div id="authOverlay" style="position:fixed;inset:0;z-index:500;background:linear-gradient(160deg,#f0f6ff,#e8f4fd);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:20px;padding:30px 24px;max-width:360px;width:100%;box-shadow:0 8px 40px rgba(14,165,233,0.15);">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;">
        <i class="bi bi-diagram-3-fill"></i>
      </div>
      <h2 style="font-size:20px;font-weight:700;color:#0f172a;margin-bottom:4px;">客户管理工作台</h2>
      <p style="font-size:13px;color:#94a3b8;">永久存储 · 数据安全 · 账号登录</p>
    </div>
    
    <div id="authForm">
      <div class="fg" style="margin-bottom:12px;">
        <label style="font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:6px;">用户名</label>
        <input type="text" id="authUser" placeholder="请输入用户名" style="width:100%;padding:13px 14px;border:1.5px solid #dbe7f0;border-radius:10px;font-size:15px;outline:none;transition:all .2s;" onfocus="this.style.borderColor='#0ea5e9';this.style.boxShadow='0 0 0 3px #e0f2fe'" onblur="this.style.borderColor='#dbe7f0';this.style.boxShadow='none'">
      </div>
      <div class="fg" style="margin-bottom:16px;">
        <label style="font-size:13px;font-weight:600;color:#475569;display:block;margin-bottom:6px;">密码</label>
        <div style="position:relative;">
          <input type="password" id="authPass" placeholder="请输入密码（至少6位）" style="width:100%;padding:13px 44px 13px 14px;border:1.5px solid #dbe7f0;border-radius:10px;font-size:15px;outline:none;transition:all .2s;" onfocus="this.style.borderColor='#0ea5e9';this.style.boxShadow='0 0 0 3px #e0f2fe'" onblur="this.style.borderColor='#dbe7f0';this.style.boxShadow='none'">
          <i class="bi bi-eye-slash" id="authPassEye" onclick="togglePass('authPass','authPassEye')" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#94a3b8;cursor:pointer;"></i>
        </div>
      </div>

async function doLogin() {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if(!u||!p){showAuthError('请输入用户名和密码');return;}
  if(!sb){ showAuthError('云端服务未加载，请检查网络后刷新页面'); return; }
  // 把用户名转成邮箱格式（Supabase需要email）
  const email = u.includes('@') ? u : u + '@client.local';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: p });
    if(error) {
      // 如果是邮箱未确认错误，提示
      if(error.message.includes('not confirmed')||error.message.includes('Email')) {
        showAuthError('账号未确认，请联系管理员或重新注册');
      } else {
        showAuthError('用户名或密码错误');
      }
      return;
    }
    enterApp();
  } catch(e) { showAuthError('连接失败：' + (e.message || JSON.stringify(e))); }
}

async function doRegister() {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if(!u||!p){showAuthError('请输入用户名和密码');return;}
  if(u.length<2){showAuthError('用户名至少2个字符');return;}
  if(p.length<6){showAuthError('密码至少6位');return;}
  if(!sb){ showAuthError('云端服务未加载，请检查网络后刷新页面'); return; }
  const email = u.includes('@') ? u : u + '@client.local';
  try {
    const { data, error } = await sb.auth.signUp({ 
      email, 
      password: p,
      options: { data: { username: u } }
    });
    if(error) {
      showAuthError(error.message||'注册失败');
      return;
    }
    // 注册成功，自动登录
    await doLogin();
  } catch(e) { showAuthError('注册连接失败：' + (e.message || JSON.stringify(e))); }
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(()=>el.style.display='none', 3000);
}

async function enterApp() {
  document.getElementById('authOverlay').style.display = 'none';
  const ub = document.getElementById('userBar');
  ub.style.display = 'flex';
  
  // 获取当前用户
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session?.user;
  if(!currentUser) { document.getElementById('authOverlay').style.display='flex'; return; }
  
  // 显示用户名
  const displayName = (currentUser.user_metadata && currentUser.user_metadata.username) || (currentUser.email||'').split('@')[0] || '用户';
  document.getElementById('userBarName').textContent = displayName;
  cloudEnabled = true;
  
  // 从 Supabase 加载数据
  setSyncStatus('loading');
  try {
    const { data: rows, error } = await sb
      .from('client_data')
      .select('data')
      .eq('user_id', currentUser.id)
      .order('updated_at', { ascending: false })
      .limit(1);
    
    if(!error && rows && rows.length > 0 && rows[0].data) {
      // 云端有数据
      let cloud = rows[0].data;
      // ---- 兼容各种历史格式，并防止坏数据覆盖本地 ----
      if(cloud && !Array.isArray(cloud) && Array.isArray(cloud.data)) cloud = cloud.data;
      if(cloud && !Array.isArray(cloud) && Array.isArray(cloud.tree)) cloud = cloud.tree;
      if(typeof cloud === 'string'){ try{ cloud = JSON.parse(cloud); }catch(_){ cloud = null; } }
      if(Array.isArray(cloud)) migrateData(cloud);
      // 云端是空数组或格式不对时，不覆盖本地：本地有数据就用本地
      const cloudEmpty = !Array.isArray(cloud) || cloud.length === 0;
      if(cloudEmpty){
        const localRaw = localStorage.getItem(K_DATA);
        let localData = null;
        try{ const p = localRaw ? JSON.parse(localRaw) : null; if(Array.isArray(p)) localData = p; }catch(_){}
        if(localData && localData.length > 0){
          data = localData;
          migrateData(data);
          console.warn('[云端数据为空，保留本地数据]');
          setTimeout(cloudSave, 0);   // 把本地数据推回云端，修复云端空数据
        }else{
          data = loadAndInit();
        }
      }else{
        data = cloud;
        try{ localStorage.setItem(K_DATA, JSON.stringify(data)); }catch(_){}
      }
      render();
    } else {
      // 云端无数据，尝试本地迁移
      const localData = tryMigrateOld();
      if(localData) {
        data = localData;
        migrateData(data);
      } else {
        data = loadAndInit();
      }
      render();
      await cloudSave();
    }

    setSyncStatus('ok');
  } catch(e) {
    console.error('云端加载失败', e);
    data = loadAndInit();
    render();

    setSyncStatus('offline');
    toast('云端连接失败，使用本地数据', 'error');
  }
}

async function logout() {
  if(!confirm('确定退出登录？')) return;

  location.reload();
}

async function doChangePass() {
  const oldP = document.getElementById('oldPass').value;
  const newP1 = document.getElementById('newPass1').value;
  const newP2 = document.getElementById('newPass2').value;
  if(!oldP||!newP1||!newP2){showCPError('请填写所有字段');return;}
  if(newP1.length<6){showCPError('新密码至少6位');return;}
  if(newP1!==newP2){showCPError('两次新密码不一致');return;}
  if(!sb){showCPError('云端服务未加载，无法修改密码');return;}
  try {
    const { data: { user } } = await sb.auth.getUser();
    if(!user){showCPError('请先登录');return;}
    const email = user.email;
    const { error: loginErr } = await sb.auth.signInWithPassword({ email, password: oldP });
    if(loginErr){showCPError('旧密码错误');return;}
    const { data, error } = await sb.auth.updateUser({ password: newP1 });
    if(error){showCPError('修改失败：'+error.message);return;}
    closeChangePass();
    alert('密码修改成功！下次登录请用新密码');
  } catch(e){showCPError('修改失败：'+(e.message||e));}
}

function setSyncStatus(status) {
  const el = document.getElementById('syncStatus');
  if(status==='loading') {
    el.innerHTML = '<i class="bi bi-arrow-repeat"></i> 同步中...';
    el.style.color = '#f59e0b';
  } else if(status==='ok') {
    el.innerHTML = '<i class="bi bi-check-circle"></i> 已同步';
    el.style.color = '#10b981';
  } else if(status==='saving') {
    el.innerHTML = '<i class="bi bi-cloud-upload"></i> 保存中...';
    el.style.color = '#f59e0b';
  } else if(status==='error') {
    el.innerHTML = '<i class="bi bi-exclamation-circle"></i> 同步失败';
    el.style.color = '#ef4444';
  } else if(status==='offline') {
    el.innerHTML = '<i class="bi bi-cloud-slash"></i> 离线模式';
    el.style.color = '#94a3b8';
  }
}

// 云端保存（防抖）
let saveTimer = null;
function cloudSaveDebounced() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(cloudSave, 1000);
}

async function cloudSave() {
  if(!cloudEnabled || !currentUser || !sb) return;
  // 绝不把非数组/空数据推到云端，否则会反过来覆盖掉本地数据
  if(!Array.isArray(data)){ console.warn('[cloudSave] data 不是数组，跳过云端保存'); return; }
  setSyncStatus('saving');
  try {
    // 先尝试按 user_id 更新（每个用户只保留一条，避免表无限膨胀）
    const { data: updated, error: upErr } = await sb
      .from('client_data')
      .update({ data: data, updated_at: new Date().toISOString() })
      .eq('user_id', currentUser.id)
      .select('id');

    if(!upErr && updated && updated.length > 0) { setSyncStatus('ok'); return; }

    // 没有记录则插入一条
    const { error } = await sb
      .from('client_data')
      .insert({ user_id: currentUser.id, data: data });

    if(!error) { setSyncStatus('ok'); }
    else { setSyncStatus('error'); console.error(error); }
  } catch(e) {
    console.error('云端保存失败', e);
    setSyncStatus('error');
  }
}

  document.getElementById('authOverlay').style.display = 'flex';
}

/* ═══════════════════════════════════════════════════════════
   加载数据（v6 策略 —— 简单、可预期）：
   1. 有本地数据 → 直接用（用户自己的增删改都保留）
   2. 本地数据不完整 → 用内置出厂数据补齐（只补缺的，不覆盖）
   3. 完全没数据 → 用内置出厂数据
   ═══════════════════════════════════════════════════════════ */
function loadAndInit(){
  // ① 先读本地
  let local = null;
  try{
    const r = localStorage.getItem(K_DATA);
    if(r && r !== 'null' && r !== 'undefined'){
      let parsed = JSON.parse(r);
      if(parsed && !Array.isArray(parsed) && Array.isArray(parsed.data)) parsed = parsed.data;
      if(parsed && !Array.isArray(parsed) && Array.isArray(parsed.tree)) parsed = parsed.tree;
      if(Array.isArray(parsed) && parsed.length > 0){
        // 清掉垃圾节点
        (function clean(list){
          if(!Array.isArray(list)) return;
          for(let i = list.length - 1; i >= 0; i--){
            const it = list[i];
            if(!it || typeof it !== 'object'){ list.splice(i, 1); continue; }
            if(it.ch !== undefined && !Array.isArray(it.ch)) it.ch = [];
            if(Array.isArray(it.ch)) clean(it.ch);
            if(it.tags !== undefined && !Array.isArray(it.tags)) it.tags = [];
          }
        })(parsed);
        if(parsed.length > 0) local = parsed;
      }
    }
  }catch(e){
    console.warn('[loadAndInit] 本地数据异常，改用出厂数据', e && e.message);
    local = null;
  }

  // ② 读出厂数据
  let factory = null;
  try{
    if(typeof BUILTIN_BACKUP !== 'undefined' && Array.isArray(BUILTIN_BACKUP) && BUILTIN_BACKUP.length){
      factory = JSON.parse(JSON.stringify(BUILTIN_BACKUP));
    }
  }catch(e){ console.warn('[loadAndInit] 出厂数据异常', e && e.message); }

  // ③ 合并：本地优先，出厂补齐
  let result;
  if(local && factory){
    result = local;
    try{
      migrateData(result);
      const copy = JSON.parse(JSON.stringify(factory));
      migrateData(copy);
      copy.forEach(area => {
        try{ mergeIntoData([area], result); }catch(e){ console.warn('[loadAndInit] 补齐失败', e && e.message); }
      });
    }catch(e){
      console.warn('[loadAndInit] 合并异常，直接用本地数据', e && e.message);
      result = local;
    }
  }else if(local){
    result = local;
    migrateData(result);
  }else if(factory){
    result = factory;
    migrateData(result);
  }else{
    result = defaultData();
  }

  // ④ 去掉多余的空节点
  try{
    (function prune(list){
      if(!Array.isArray(list)) return;
      for(let i = list.length - 1; i >= 0; i--){
        const it = list[i];
        if(!it || typeof it !== 'object'){ list.splice(i, 1); continue; }
        if(Array.isArray(it.ch)){
          prune(it.ch);
          if(it.ch.length === 0 && !safeStr(it.ph) && !safeStr(it.note)) list.splice(i, 1);
        }
      }
    })(result);
  }catch(e){}

  // ⑤ 确保有 id
  (function ensureIds(list){
    if(!Array.isArray(list)) return;
    for(const it of list){
      if(!it || typeof it !== 'object') continue;
      if(!it.id) it.id = uid();
      if(Array.isArray(it.ch)) ensureIds(it.ch);
    }
  })(result);

  // ⑥ 回写
  try{ localStorage.setItem(K_DATA, JSON.stringify(result)); }catch(e){}
  return result;
}

function tryMigrateOld(){

  for(const k of oldKeys){
    try{
      const old=localStorage.getItem(k);
      if(old){
        const parsed=JSON.parse(old);
        if(parsed&&Array.isArray(parsed)&&parsed.length>0){
          console.log('找到旧数据：'+k+'，'+parsed.length+'个区域');
          return parsed;
        }
      }
    }catch(e){}
  }
  return null;
}

/* 迁移旧数据结构：补齐ch数组、col字段，旧结构楼层直接挂客户的需要加室层级 */
function migrateData(list){
  function walk(n,lv){
    if(!n||typeof n!=='object')return;
    // 强制规范化字段类型：标题/电话/备注必须是字符串，防止 toLowerCase 等调用报错
    if(!n.id)n.id=uid();
    n.t=safeStr(n.t)||'（未命名）';
    if(n.ph!==undefined&&n.ph!==null&&n.ph!=='')n.ph=safeStr(n.ph);
    if(n.note!==undefined&&n.note!==null&&n.note!=='')n.note=safeStr(n.note);
    if(n.tags&&!Array.isArray(n.tags))n.tags=[safeStr(n.tags)];
    // 旧版v4及之前是4层（区域→楼盘→楼层→客户），v5是5层（多了"室"）
    // 如果楼层(lv=3)的子节点没有ch字段，说明是旧结构，需要包裹一层"室"
    if(lv===3&&Array.isArray(n.ch)&&n.ch.length>0){
      // 检查子节点是否是客户（有ph字段，没有ch）
      const hasOldClients=n.ch.some(c=>c&&typeof c==='object'&&c.ph!==undefined&&!c.ch);
      if(hasOldClients){
        // 把这些客户包裹到一个"默认室"里
        const clients=n.ch.filter(c=>c&&typeof c==='object'&&c.ph!==undefined&&!c.ch);
        const others=n.ch.filter(c=>!(c&&typeof c==='object'&&c.ph!==undefined&&!c.ch));
        if(clients.length>0){
          const room={id:uid(),t:'默认室',col:false,ch:clients};
          n.ch=[...others,room];
        }
      }
    }
    if(lv<5){
      if(!Array.isArray(n.ch))n.ch=[];
      n.ch.forEach(c=>walk(c,lv+1));
    }
    // 室（第4层）需要col字段
    if(lv===4&&n.col===undefined)n.col=false;
  }
  if(!Array.isArray(list)){ console.warn('[migrateData] 传入的不是数组，已忽略：', list); return false; }
  list.forEach(n=>walk(n,1));
  return true;
}

/* 导航：navPath存id，最多到楼层(3级)，室(4)用展开 */
let navPath=[]; // [] → 区域, [areaId] → 楼盘, [areaId,buildingId] → 楼层

function find(id,list=data,parent=null){
  for(const it of list){if(it.id===id)return{node:it,list,parent};if(it.ch){const r=find(id,it.ch,it);if(r)return r;}}
  return null;
}
function findPath(id,list=data,path=[]){
  for(const it of list){const np=[...path,it];if(it.id===id)return np;if(it.ch){const r=findPath(id,it.ch,np);if(r)return r;}}
  return null;
}
function countBy(list,lv,cur=1){let c=0;for(const it of (Array.isArray(list)?list:[])){if(!it||typeof it!=='object')continue;if(cur===lv)c++;if(it.ch)c+=countBy(it.ch,lv,cur+1);}return c;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* 获取当前层级列表：navPath决定到第几层 */
function getCurrentList(){
  if(navPath.length===0)return data; // 区域列表
  const last=navPath[navPath.length-1];
  const f=find(last);
  return f&&f.node.ch?f.node.ch:[];
}
/* 当前导航层级：1=区域列表, 2=楼盘列表, 3=楼层列表(含室,展开式) */
function getCurrentLevel(){return navPath.length+1;}

function getBreadcrumb(){
  const crumbs=[{t:'全部区域',id:null}];
  let cur=data;
  for(const id of navPath){
    const f=find(id,cur);
    if(f){crumbs.push({t:f.node.t,id:f.node.id});cur=f.node.ch;}
    else break;
  }
  return crumbs;
}

function renderBreadcrumb(){

  const crumbs=getBreadcrumb();

  crumbs.forEach((c,i)=>{

  breadcrumbWrap.innerHTML=h;

function renderToolbar(){
  const lv=getCurrentLevel();

  const info=LV[lv];

  if(lv===1)titleText='区域列表';
  else if(lv===2)titleText='楼盘列表';
  else if(lv===3)titleText='楼层列表（点击室展开客户）';
  else titleText=info.child?info.child+'列表':'列表';
  
  toolbarWrap.innerHTML=`<div class="page-title">
    <i class="bi ${info.ic}"></i>${titleText}
    <span class="pt-count">（${list.length}）</span>
  </div>`;
}

function renderPage(){
  renderToolbar();
  const lv=getCurrentLevel();
  const list=getCurrentList();
  const container=pageContent;
  container.innerHTML='';

  if(list.length===0){
    const childInfo=lv<5?LV[lv+1]:null;
    container.innerHTML=`<div class="empty-hint">
      <i class="bi bi-inboxes"></i>
      <h3>暂无${childInfo?childInfo.n:'客户'}</h3>
      <p>点击右下角加号添加${childInfo?childInfo.n:'客户'}</p>

    return;

  const listDiv=document.createElement('div');
  listDiv.className='list';

  if(lv===1){
    list.forEach(n=>listDiv.appendChild(makeAreaCard(n)));
  }else if(lv===2){
    list.forEach(n=>listDiv.appendChild(makeBuildingCard(n)));

    // 楼层列表：每个楼层下显示室，室可展开

    initSort(listDiv,list);
  }
}

/* 绑定室卡片内的操作 */
function bindRoomCards(floorEl,floorNode){
  // 遍历所有室
  if(!floorNode.ch)return;
  floorNode.ch.forEach(room=>{
    const roomEl=floorEl.querySelector(`[data-room-id="${room.id}"]`);
    if(!roomEl)return;
    
    // 展开/折叠
    const head=roomEl.querySelector('.room-head');
    const toggle=head.querySelector('.r-toggle');
    const body=roomEl.querySelector('.room-body');
    
    head.addEventListener('click',function(e){
      if(e.target.closest('button')||e.target.closest('.drag'))return;
      setCol(room,!isCol(room));
      render();
    });
    
    // 添加客户
    const addBtn=head.querySelector('[data-ract=add]');
    if(addBtn)addBtn.onclick=e=>{e.stopPropagation();openAdd(room,5);};
    // 编辑室
    const editBtn=head.querySelector('[data-ract=edit]');
    if(editBtn)editBtn.onclick=e=>{e.stopPropagation();openEdit(room,4);};
    // 删除室
    const delBtn=head.querySelector('[data-ract=del]');
    if(delBtn)delBtn.onclick=e=>{e.stopPropagation();openDelete(room,4);};
    
    // 客户操作
    if(room.ch){
      room.ch.forEach(client=>{
        const clientEl=roomEl.querySelector(`.client[data-id="${client.id}"]`);
        if(!clientEl)return;
        const editC=clientEl.querySelector('[data-cact=edit]');
        const delC=clientEl.querySelector('[data-cact=del]');
        if(editC)editC.onclick=e=>{e.stopPropagation();openEdit(client,5);};
        if(delC)delC.onclick=e=>{e.stopPropagation();openDelete(client,5);};
      });
    }
  });
  
  // 室的拖拽排序
  const roomsContainer=floorEl.querySelector('.floor-rooms');
  if(roomsContainer&&floorNode.ch&&window.Sortable){
    Sortable.create(roomsContainer,{
      group:'rooms_'+floorNode.id,
      animation:180,
      handle:'.drag',
      ghostClass:'sortable-ghost',
      chosenClass:'sortable-chosen',
      onStart:function(){document.body.style.userSelect='none';},
      onEnd:function(){
        document.body.style.userSelect='';
        const map={};floorNode.ch.forEach(it=>map[it.id]=it);
        const newArr=[];
        roomsContainer.querySelectorAll(':scope > .room').forEach(el=>{
          const id=el.dataset.roomId;
          if(map[id])newArr.push(map[id]);
        });
        floorNode.ch.length=0;newArr.forEach(it=>floorNode.ch.push(it));
        if(save()){toast('排序已保存','success');}
        else{toast('保存失败','error');}
      }
    });
  }
  
  // 客户的拖拽排序（每个室内）
  if(floorNode.ch){
    floorNode.ch.forEach(room=>{
      const body=floorEl.querySelector(`[data-body-room="${room.id}"]`);
      if(body&&room.ch&&room.ch.length&&window.Sortable){
        Sortable.create(body,{
          group:'clients_'+room.id,
          animation:180,
          handle:'.drag',
          ghostClass:'sortable-ghost',
          chosenClass:'sortable-chosen',
          onStart:function(){document.body.style.userSelect='none';},
          onEnd:function(){
            document.body.style.userSelect='';
            const map={};room.ch.forEach(it=>map[it.id]=it);
            const newArr=[];
            body.querySelectorAll(':scope > .client').forEach(el=>{
              const id=el.dataset.id;
              if(map[id])newArr.push(map[id]);
            });
            room.ch.length=0;newArr.forEach(it=>room.ch.push(it));
            if(save()){toast('排序已保存','success');}
            else{toast('保存失败','error');}
          }
        });
      }
    });
  }
}

/* 拖拽（区域/楼盘列表） */
function initSort(container,arr){

      <div class="fg"><label>标签（逗号分隔）</label><input type="text" id="i_tags" placeholder="如：VIP, 高意向"></div>`;
    }else{
      h+=`<div class="fg"><label>${LV[l].n}名称 <span class="req">*</span></label><input type="text" id="i_t" placeholder="${ph(l)}"></div>`;

function collectByLevel(target,list=data,cur=1,path=''){
  let r=[];
  for(const it of list){
    const p=path?`${path} / ${it.t}`:it.t;
    if(cur===target)r.push({id:it.id,path:p});
    if(it.ch&&cur<target)r=r.concat(collectByLevel(target,it.ch,cur+1,p));
  }
  return r;
}

/* 安全转字符串：兼容数字/布尔/null/对象等异常数据，避免 toLowerCase 报错 */
function safeStr(v){
  if(v===undefined||v===null)return'';
  if(typeof v==='string')return v;
  if(typeof v==='object'){try{return JSON.stringify(v);}catch(e){return'';}}
  return String(v);
}

    searchPanel.innerHTML = '<div class="sr-empty"><i class="bi bi-emoji-frown"></i> 没找到「' + esc(raw) + '」<br><span style="font-size:12px;opacity:.7">可试试客户名、手机号、房间号或备注里的词</span></div>';
    searchPanel.classList.add('show');

  }

  const groups = [
    { lv: 5, name: '客户', icon: 'bi-person-fill' },
    { lv: 4, name: '房间', icon: 'bi-door-open-fill' },
    { lv: 3, name: '楼层', icon: 'bi-layers-fill' },
    { lv: 2, name: '楼盘', icon: 'bi-buildings-fill' },
    { lv: 1, name: '区域', icon: 'bi-geo-alt-fill' }
  ];

  let html = '<div class="sr-count">共找到 <b>' + res.length + '</b> 条</div>';

  for(const g of groups){
    const items = res.filter(r => r.lv === g.lv);

    const LIMIT = 20;

    const rest = items.length - show.length;

    html += '<div class="sr-group"><i class="bi ' + g.icon + '"></i> ' + g.name + '（' + items.length + '）</div>';

    for(const r of show){
      let parentPath = '';
      if(r.path && r.title && r.path !== r.title){
        parentPath = r.path.slice(0, r.path.length - r.title.length - 3);
      }
      html += '<div class="sr-item" onclick="locate(\'' + esc(r.id) + '\')">';
      if(parentPath) html += '<div class="sr-path">' + esc(parentPath) + '</div>';
      html += '<div class="sr-title">' + hl(r.title, q) + '</div>';
      if(r.ph)   html += '<div class="sr-phone"><i class="bi bi-telephone-fill"></i>' + hl(r.ph, q) + '</div>';
      if(r.note) html += '<div class="sr-phone"><i class="bi bi-sticky"></i>' + hl(r.note, q) + '</div>';
      if(r.tags && r.tags.length){
        html += '<div class="sr-tags">' + r.tags.map(t => '<span class="sr-tag">' + esc(t) + '</span>').join('') + '</div>';
      }
      html += '</div>';
    }

    if(rest > 0){
      html += '<div class="sr-more" data-more="' + g.lv + '">还有 ' + rest + ' 条 —— 再输入一个字缩小范围</div>';
    }
  }

  searchPanel.innerHTML = html;
  searchPanel.classList.add('show');
}


/**
 * 搜索：匹配节点自身及其所有子孙节点
 * —— 搜"置地"时，会同时列出"置地广场E座"以及它下面的全部楼层/房间/客户
 * 逻辑：先判断自己是否命中；命中则把整棵子树全部带出；未命中则看子孙是否有命中
 */
/* ══════════════════════════════════════════════════════════
   搜索核心：全字段匹配 + 逐级展开
   —— 支持：客户名 / 电话 / 备注 / 标签 / 房间号 / 楼层 / 楼盘 / 区域
   —— 搜到父节点时，自动把它的所有子孙也一并列出（附带所在路径）
   ══════════════════════════════════════════════════════════ */
function reEscape(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* 单节点自身是否命中 */
function nodeHits(it, q){
  if(!it || typeof it !== 'object') return false;
  if(safeStr(it.t).toLowerCase().indexOf(q) >= 0) return true;
  if(safeStr(it.ph).toLowerCase().indexOf(q) >= 0) return true;
  if(safeStr(it.note).toLowerCase().indexOf(q) >= 0) return true;
  if(Array.isArray(it.tags)){
    for(const g of it.tags){
      if(safeStr(g).toLowerCase().indexOf(q) >= 0) return true;
    }
  }
  return false;
}

/* 扁平化整棵子树 */
function collectAll(list, path, lv){
  let r = [];
  if(!Array.isArray(list)) return r;
  for(const it of list){
    if(!it || typeof it !== 'object') continue;
    const title = safeStr(it.t);
    const p = path ? (path + ' / ' + title) : title;
    r.push({
      id: it.id,
      title: title,
      ph: safeStr(it.ph),
      note: safeStr(it.note),
      path: p,
      tags: Array.isArray(it.tags) ? it.tags.map(safeStr).filter(Boolean) : [],
      lv: lv,
      hit: false
    });
    if(Array.isArray(it.ch) && it.ch.length) r = r.concat(collectAll(it.ch, p, lv + 1));
  }
  return r;
}

/* 主搜索：返回样式统一的扁平结果数组（与旧版 UI 完全兼容） */
function searchTree(query){
  const q = safeStr(query).trim().toLowerCase();
  if(!q || !Array.isArray(data)) return [];

  const out = [];
  const seen = new Set();

  function pushAll(list, path, lv){
    if(!Array.isArray(list)) return;
    for(const it of list){
      if(!it || typeof it !== 'object') continue;
      const title = safeStr(it.t);
      const p = path ? (path + ' / ' + title) : title;
      const key = (it.id || '') + '|' + p;
      if(!seen.has(key)){
        seen.add(key);
        out.push({
          id: it.id,
          title: title,
          ph: safeStr(it.ph),
          note: safeStr(it.note),
          path: p,
          tags: Array.isArray(it.tags) ? it.tags.map(safeStr).filter(Boolean) : [],
          lv: lv,
          hit: false
        });
      }
      if(Array.isArray(it.ch) && it.ch.length) pushAll(it.ch, p, lv + 1);
    }
  }

  /* 找命中的节点，然后把命中节点自身 + 其整棵子树带出；同时把祖先链带出一次 */
  function walk(list, path, lv){
    if(!Array.isArray(list)) return false;
    let branchHit = false;
    for(const it of list){
      if(!it || typeof it !== 'object') continue;
      const title = safeStr(it.t);
      const p = path ? (path + ' / ' + title) : title;
      const selfHit = nodeHits(it, q);
      const childHit = (Array.isArray(it.ch) && it.ch.length) ? walk(it.ch, p, lv + 1) : false;

      if(selfHit && !childHit){
        // 自己命中：带出自己和整棵子树
        pushAll([it], path, lv);
        branchHit = true;
      }else if(childHit){
        // 子孙命中：只带出自己这一层作为路径指引
        const key = (it.id || '') + '|' + p;
        if(!seen.has(key)){
          seen.add(key);
          out.push({
            id: it.id, title: title, ph: safeStr(it.ph), note: safeStr(it.note),
            path: p, tags: [], lv: lv, hit: false
          });
        }
        if(selfHit) branchHit = true;
        else branchHit = true;
      }else if(selfHit){
        pushAll([it], path, lv);
        branchHit = true;
      }
    }
    return branchHit;
  }

  walk(data, '', 1);

  // 排序：客户(5) → 室(4) → 楼层(3) → 楼盘(2) → 区域(1)
  const rank = { 5: 0, 4: 1, 3: 2, 2: 3, 1: 4 };
  out.sort((a, b) => (rank[a.lv] ?? 9) - (rank[b.lv] ?? 9));
  return out;
}

/* 高亮：命中片段标黄 */
function hl(text, q){
  const t = safeStr(text);
  if(!t) return '';
  const k = safeStr(q).trim();
  if(!k) return esc(t);
  try{
    const rx = new RegExp('(' + reEscape(k) + ')', 'gi');
    return esc(t).replace(rx, '<mark>$1</mark>');
  }catch(e){
    return esc(t);
  }
}

/* 导出Excel：把树状数据扁平化为表格行 */
function exportData(){
  const rows=[];
  function walk(node,lv,path){
    const curPath=path?[...path,node.t]:[node.t];
    // 客户层（第5层）：输出一行
    if(lv===5){
      rows.push({

        '楼盘':path[1]||'',

        '室':path[3]||'',

        '联系电话':node.ph||'',
        '备注':node.note||'',
        '标签':(node.tags||[]).join('、')
      });
    }
    if(node.ch&&node.ch.length){
      node.ch.forEach(c=>walk(c,lv+1,curPath));
    }
  }
  data.forEach(n=>walk(n,1,[]));

  if(rows.length===0){toast('暂无客户数据可导出','error');return;}

  const ws=XLSX.utils.json_to_sheet(rows);
  // 设置列宽
  ws['!cols']=[{wch:14},{wch:16},{wch:8},{wch:10},{wch:12},{wch:16},{wch:24},{wch:16}];
  const wb=XLSX.utils.book_new();

  toast(`已导出${rows.length}条客户记录`,'success');
}

/* 把Excel表格行转回树结构 */
function rowsToTree(rows){
  const root=[];
  const areaMap={},buildingMap={},floorMap={},roomMap={};
  
  rows.forEach(row=>{
    // Excel 里的数字/日期单元格会被解析为非字符串，统一转成字符串，避免后续报错
    const area=safeStr(row['区域']).trim();
    const building=safeStr(row['楼盘']).trim();
    const floor=safeStr(row['楼层']).trim();
    const room=safeStr(row['室']).trim();
    const name=safeStr(row['客户姓名']).trim();
    const phone=safeStr(row['联系电话']).trim();
    const note=safeStr(row['备注']).trim();
    const tagsStr=safeStr(row['标签']).trim();
    const tags=tagsStr?tagsStr.split(/[、,，]/).map(t=>t.trim()).filter(Boolean):[];
    
    if(!area)return;
    
    // 区域
    if(!areaMap[area]){
      const node={id:uid(),t:area,ch:[]};
      areaMap[area]=node;
      root.push(node);
    }
    const areaNode=areaMap[area];
    
    if(!building)return;
    // 楼盘
    const bKey=area+'|'+building;
    if(!buildingMap[bKey]){
      const node={id:uid(),t:building,ch:[]};
      buildingMap[bKey]=node;
      areaNode.ch.push(node);
    }
    const bNode=buildingMap[bKey];
    
    if(!floor)return;
    // 楼层
    const fKey=area+'|'+building+'|'+floor;
    if(!floorMap[fKey]){
      const node={id:uid(),t:floor,ch:[]};
      floorMap[fKey]=node;
      bNode.ch.push(node);
    }
    const fNode=floorMap[fKey];
    
    if(!room)return;
    // 室
    const rKey=area+'|'+building+'|'+floor+'|'+room;
    if(!roomMap[rKey]){
      const node={id:uid(),t:room,col:false,ch:[]};
      roomMap[rKey]=node;
      fNode.ch.push(node);
    }
    const rNode=roomMap[rKey];
    
    // 客户
    if(name){
      rNode.ch.push({id:uid(),t:name,ph:phone,note,tags});
    }
  });
  
  return root;
}

/* 合并逻辑（供文件导入与内置备份共用）：按名称逐层去重合并，不删除已有；带脏数据防护 */
function mergeIntoData(imported, target){
  if(!Array.isArray(imported))return;
  const dest = Array.isArray(target) ? target : data;
  if(!Array.isArray(dest))return;
  imported.forEach(impArea=>{
    try{ mergeOneArea(impArea, dest); }
    catch(e){ console.warn('[mergeIntoData] 跳过一条无法合并的数据', e && e.message); }
  });
}
function mergeOneArea(impArea, dest){
  if(!impArea||typeof impArea!=='object')return;
  const target = Array.isArray(dest) ? dest : data;
  if(!Array.isArray(target))return;
  // 查找现有数据中是否有同名区域
  const existing=target.find(d=>d&&typeof d==='object'&&d.t===impArea.t);
  if(existing){
    if(!Array.isArray(existing.ch))existing.ch=[];
    // 同名区域，合并楼盘
    (Array.isArray(impArea.ch)?impArea.ch:[]).forEach(impBuilding=>{
      if(!impBuilding||typeof impBuilding!=='object')return;
      const exBuilding=existing.ch.find(b=>b&&typeof b==='object'&&b.t===impBuilding.t);
      if(exBuilding){
        if(!Array.isArray(exBuilding.ch))exBuilding.ch=[];
        // 同名楼盘，合并楼层
        (Array.isArray(impBuilding.ch)?impBuilding.ch:[]).forEach(impFloor=>{
          if(!impFloor||typeof impFloor!=='object')return;
          const exFloor=exBuilding.ch.find(f=>f&&typeof f==='object'&&f.t===impFloor.t);
          if(exFloor){
            if(!Array.isArray(exFloor.ch))exFloor.ch=[];
            // 同名楼层，合并室
            (Array.isArray(impFloor.ch)?impFloor.ch:[]).forEach(impRoom=>{
              if(!impRoom||typeof impRoom!=='object')return;
              const exRoom=exFloor.ch.find(r=>r&&typeof r==='object'&&r.t===impRoom.t);
              if(exRoom){
                if(!Array.isArray(exRoom.ch))exRoom.ch=[];
                // 同名室，合并客户（按客户姓名+电话去重）
                (Array.isArray(impRoom.ch)?impRoom.ch:[]).forEach(impClient=>{
                  if(!impClient||typeof impClient!=='object')return;
                  const dup=exRoom.ch.find(c=>c&&typeof c==='object'&&c.t===impClient.t&&(c.ph||'')===(impClient.ph||''));
                  if(!dup)exRoom.ch.push(impClient);
                });
              }else{
                // 新室，直接添加
                exFloor.ch.push(impRoom);
              }
            });
          }else{
            // 新楼层，直接添加
            exBuilding.ch.push(impFloor);
          }
        });
      }else{
        // 新楼盘，直接添加
        existing.ch.push(impBuilding);
      }
    });
  }else{
    // 新区域，直接添加
    target.push(impArea);
  }
}

/* 合并导入：文件导入的确认入口 */
function confirmMergeImport(){
  if(!window._pendingImport)return;
  const imported=window._pendingImport;
  window._pendingImport=null;
  mergeIntoData(imported);
  if(save()){closeModal();render();toast(`合并导入成功，现有数据已保留`,'success');}
  else toast('保存失败','error');
}

/* 一键恢复内置备份：无需选择文件，把打包在页面里的客户资料合并进当前数据 */
function restoreBuiltin(){
  if(typeof BUILTIN_BACKUP==='undefined'||!Array.isArray(BUILTIN_BACKUP)||BUILTIN_BACKUP.length===0){toast('内置备份不可用','error');return;}
  if(!confirm('将内置备份中的 '+countBy(BUILTIN_BACKUP,5)+' 位客户合并到当前数据（不删除现有内容），确定？'))return;
  const copy=JSON.parse(JSON.stringify(BUILTIN_BACKUP));
  migrateData(copy);
  mergeIntoData(copy);
  if(save()){closeModal();render();toast('已恢复内置备份，'+countBy(copy,5)+'位客户已合并','success');}
  else toast('保存失败','error');
}

/* ========== Toast ========== */
const toastEl=document.getElementById('toast');
let toastTimer=null;
function toast(msg,type='success'){
  toastEl.className='toast '+type;
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2000);
}

/* 返回键 */
window.addEventListener('popstate',function(e){
  if(modalBg.classList.contains('show')){closeModal();return;}
  if(navPath.length>0){navPath.pop();render();window.scrollTo({top:0,behavior:'smooth'});}
});
